<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEGGIE.ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Google Fonts for the Swiss/International Style look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#ccff00', // Neon Lime
                dark: '#a3cc00',
              },
              surface: {
                DEFAULT: '#0a0a0a', // Almost Black
                100: '#171717', // Dark Grey
                200: '#262626',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Oswald', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #262626 1px, transparent 1px), linear-gradient(to bottom, #262626 1px, transparent 1px)",
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar - Brutalist style */
      ::-webkit-scrollbar {
        width: 12px;
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #262626;
        border: 2px solid #0a0a0a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ccff00;
      }
      body {
        background-color: #0a0a0a;
      }
    </style>
  <script type="importmap">
{
  "imports": {

    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body class="bg-surface text-white font-sans antialiased overflow-hidden h-screen selection:bg-brand selection:text-black">
